experiment_dir: OVERRIDE_ME
save_checkpoint: true
save_per_epoch_diagnostics: true
seed: 1
validate_using_ema: true
ema:
  decay: 0.999
max_epochs: 30
checkpoint_save_epochs: null
ema_checkpoint_save_epochs:
  step: 1
inference:
- name: inference
  weight: 1.0
  epochs:
    start: 2
    step: 3
  n_forward_steps: 2920
  forward_steps_in_memory: 20
  loader:
    start_indices:
      times:
      - '1940-01-03T12:00:00'
      - '1941-10-03T12:00:00'
      - '1943-07-03T12:00:00'
      - '1945-04-03T12:00:00'
      - '1947-01-03T12:00:00'
      - '1948-10-03T12:00:00'
      - '1950-07-03T12:00:00'
      - '1952-04-03T12:00:00'
      - '1954-01-03T12:00:00'
      - '1955-10-03T12:00:00'
      - '1957-07-03T12:00:00'
      - '1959-04-03T12:00:00'
      - '1961-01-03T12:00:00'
      - '1962-10-03T12:00:00'
      - '1964-07-03T12:00:00'
      - '1966-04-03T12:00:00'
    dataset:
      data_path: /pscratch/sd/m/mahf708/v3.LR.historical_0101.aigo/run
      file_pattern: v3.LR.historical_0101.aigo.eam.h0.*.nc
      rename: &id002
        PRECT: surface_precipitation_rate
        PRECST: frozen_precipitation_rate
        co2vmr: global_mean_co2
      reference_pressure_name: P0
      overwrite: &id003
        multiply_scalar:
          surface_precipitation_rate: 1000.0
          frozen_precipitation_rate: 1000.0
    num_data_workers: 8
  aggregator:
    histogram:
      enabled: true
      variables: &id001
      - PS
      - TS
      - LHFLX
      - SHFLX
      - surface_precipitation_rate
      - frozen_precipitation_rate
      - FLUS
      - FLUT
      - FLDS
      - FSNS
      - FSUTOA
      - DTENDTTW
      - TAUX
      - TAUY
      - Qat2m
      - Uat10m
      - Vat10m
      - Tat2m
      - T_0
      - T_1
      - T_4
      - T_6
      - T_7
      - STW_0
      - STW_1
      - STW_4
      - STW_6
      - STW_7
      - U_0
      - U_1
      - U_4
      - U_6
      - U_7
      - V_0
      - V_1
      - V_4
      - V_6
      - V_7
    zonal_mean:
      enabled: false
    video:
      enabled: false
    trend:
      enabled: false
    seasonal:
      enabled: false
    near_zero_fraction:
      enabled: false
    enso_coefficient:
      enabled: false
    step_diagnostics:
      correction_scalars: true
      correction_maps: false
    time_mean_denorm:
      plot_variables: *id001
    time_mean_norm:
      target: norm
      plot_variables: *id001
    power_spectrum:
      plot_variables: *id001
    ipo_index:
      enabled: false
logging:
  log_to_screen: true
  log_to_wandb: true
  log_to_file: true
  project: ACE2S-sep26v2-atm
  entity: e3sm-aig
train_loader:
  batch_size: 16
  num_data_workers: 8
  time_buffer: 10
  time_buffer_pool_size: 2
  prefetch_factor: 4
  dataset:
    concat:
    - data_path: /pscratch/sd/m/mahf708/v3.LR.historical_0101.aigo/run
      file_pattern: v3.LR.historical_0101.aigo.eam.h0.*.nc
      rename: *id002
      reference_pressure_name: P0
      overwrite: *id003
      subset:
        start_time: '1940-01-01T06:00:00'
        stop_time: '1970-01-01T00:00:00'
    - data_path: /pscratch/sd/m/mahf708/v3.LR.historical_0101.aigo/run
      file_pattern: v3.LR.historical_0101.aigo.eam.h0.*.nc
      rename: *id002
      reference_pressure_name: P0
      overwrite: *id003
      subset:
        start_time: '1980-01-01T06:00:00'
        stop_time: '1990-01-01T00:00:00'
validation:
  loader:
    batch_size: 16
    num_data_workers: 8
    time_buffer: 10
    time_buffer_pool_size: 2
    prefetch_factor: 4
    dataset:
      data_path: /pscratch/sd/m/mahf708/v3.LR.historical_0101.aigo/run
      file_pattern: v3.LR.historical_0101.aigo.eam.h0.*.nc
      rename: *id002
      reference_pressure_name: P0
      overwrite: *id003
      subset:
        start_time: '1970-01-01T06:00:00'
        stop_time: '1980-01-01T00:00:00'
  aggregator:
    snapshot:
      enabled: false
    mean_map:
      enabled: false
    ensemble_denorm:
      log_mean_maps: false
optimization:
  enable_automatic_mixed_precision: false
  lr: 0.0001
  optimizer_type: FusedAdam
  use_gradient_accumulation: true
  kwargs:
    weight_decay: 0.01
stepper_training:
  n_ensemble: 1
  n_forward_steps: 2
  optimize_last_step_only: false
  loss:
    type: MSE
stepper:
  step:
    type: single_module
    config:
      residual_prediction: false
      builder:
        type: NoiseConditionedSFNO
        config:
          embed_dim: 384
          checkpointing: 3
          noise_embed_dim: 0
          noise_type: gaussian
          filter_type: linear
          use_mlp: true
          num_layers: 8
          operator_type: dhconv
          separable: false
          spectral_layers: 3
          spectral_transform: sht
          affine_norms: true
      normalization:
        network:
          global_means_path: /pscratch/sd/i/imanick/sep26v3/stats/centering.nc
          global_stds_path: /pscratch/sd/i/imanick/sep26v3/stats/scaling-full-field.nc
        residual:
          global_means_path: /pscratch/sd/i/imanick/sep26v3/stats/centering.nc
          global_stds_path: /pscratch/sd/i/imanick/sep26v3/stats/scaling-residual.nc
      ocean:
        surface_temperature_name: TS
        ocean_fraction_name: OCNFRAC
        interpolate: true
      corrector:
        conserve_dry_air: true
        moisture_budget_correction: advection_and_precipitation
        force_positive_names:
        - STW_0
        - STW_1
        - STW_2
        - STW_3
        - STW_4
        - STW_5
        - STW_6
        - STW_7
        - surface_precipitation_rate
        - frozen_precipitation_rate
        - FLUS
        - FLUT
        - FLDS
        - FSNS
        - FSUTOA
      next_step_forcing_names:
      - SOLIN
      in_names:
      - LANDFRAC
      - OCNFRAC
      - ICEFRAC
      - PHIS
      - SOLIN
      - PS
      - TS
      - T_0
      - T_1
      - T_2
      - T_3
      - T_4
      - T_5
      - T_6
      - T_7
      - STW_0
      - STW_1
      - STW_2
      - STW_3
      - STW_4
      - STW_5
      - STW_6
      - STW_7
      - U_0
      - U_1
      - U_2
      - U_3
      - U_4
      - U_5
      - U_6
      - U_7
      - V_0
      - V_1
      - V_2
      - V_3
      - V_4
      - V_5
      - V_6
      - V_7
      - Qat2m
      - Uat10m
      - Vat10m
      - Tat2m
      out_names:
      - PS
      - TS
      - T_0
      - T_1
      - T_2
      - T_3
      - T_4
      - T_5
      - T_6
      - T_7
      - STW_0
      - STW_1
      - STW_2
      - STW_3
      - STW_4
      - STW_5
      - STW_6
      - STW_7
      - U_0
      - U_1
      - U_2
      - U_3
      - U_4
      - U_5
      - U_6
      - U_7
      - V_0
      - V_1
      - V_2
      - V_3
      - V_4
      - V_5
      - V_6
      - V_7
      - LHFLX
      - SHFLX
      - surface_precipitation_rate
      - frozen_precipitation_rate
      - FLUS
      - FLUT
      - FLDS
      - FSNS
      - FSUTOA
      - DTENDTTW
      - TAUX
